site_name: Kite
site_description: Icecast-compatible streaming server in Go
site_url: https://master290.github.io/kite/
repo_url: https://github.com/Master290/kite
repo_name: Master290/kite
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - BUTT: butt.md
      - Troubleshooting: troubleshooting.md
  - Deploy:
      - Production: deployment.md
      - Operations: operations.md
      - Configuration: configuration.md
  - Reference:
      - HTTP API: api.md
      - Web transports: web-transports.md
      - Architecture: architecture.md

