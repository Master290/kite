<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kite - Server Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Kite</a>
      <div class="navbar-nav ms-auto">
        <span class="navbar-text me-3">
          <span class="badge bg-success">Online</span>
        </span>
        <span class="navbar-text">
          Listeners: <strong id="total-listeners">0</strong>
        </span>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Mount Points</h1>
      <span class="text-muted small" id="mounts-count">Loading streams...</span>
    </div>

    <div id="mounts-container">
      <div class="card shadow-sm text-center py-5 text-muted">
        <p class="mb-0">Loading status...</p>
      </div>
    </div>

    <footer class="pt-4 my-md-5 pt-md-5 border-top text-center text-muted small">
      <p class="mb-1">Kite Streaming Server &bull; Icecast Compatible</p>
      <ul class="list-inline mb-0">
        <li class="list-inline-item"><a href="/status-json.xsl" class="text-decoration-none">JSON Status</a></li>
        <li class="list-inline-item">&bull;</li>
        <li class="list-inline-item"><a href="https://master290.github.io/kite/" class="text-decoration-none" target="_blank" rel="noopener">Documentation</a></li>
        <li class="list-inline-item">&bull;</li>
        <li class="list-inline-item"><a href="https://github.com/Master290/kite" class="text-decoration-none" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </footer>
  </div>

  <script>
    (function () {
      const container = document.getElementById("mounts-container");
      const mountsCountEl = document.getElementById("mounts-count");
      const totalListenersEl = document.getElementById("total-listeners");
      const eventSources = {};

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderMounts(items) {
        if (!items || items.length === 0) {
          container.innerHTML = `
            <div class="card shadow-sm text-center py-5 text-muted">
              <p class="mb-1 fw-semibold">No active streams</p>
              <p class="small mb-0">Connect an Icecast source to start broadcasting.</p>
            </div>
          `;
          mountsCountEl.textContent = "0 active";
          totalListenersEl.textContent = "0";
          return;
        }

        mountsCountEl.textContent = `${items.length} ${items.length === 1 ? "mount" : "mounts"}`;
        let totalListeners = 0;

        container.innerHTML = items.map((m) => {
          totalListeners += m.listeners || 0;
          let badgeClass = "bg-secondary";
          let statusText = "Offline";

          if (m.source_connected) {
            badgeClass = "bg-success";
            statusText = "Live";
          } else if (m.active_source && m.active_source !== "none") {
            badgeClass = "bg-warning text-dark";
            statusText = m.active_source;
          }

          const profile = (m.profile || "audio").toUpperCase();
          const title = m.metadata?.title || "Live Stream";
          const streamName = m.server_name || m.name || m.description || "";
          const m3uUrl = `/_kite/v1/playlist.m3u?mount=${encodeURIComponent(m.path)}`;

          return `
            <div class="card shadow-sm mb-3">
              <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <div>
                  <span class="fw-bold fs-5">${escapeHtml(m.path)}</span>
                  ${streamName ? `<span class="text-muted ms-2">${escapeHtml(streamName)}</span>` : ""}
                </div>
                <div>
                  <span class="badge ${badgeClass} me-1" id="badge-${encodeURIComponent(m.path)}">${escapeHtml(statusText)}</span>
                  <span class="badge bg-secondary">${escapeHtml(profile)}</span>
                </div>
              </div>
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <div class="text-muted small">Now Playing:</div>
                    <div class="fw-semibold text-truncate mb-2" id="title-${encodeURIComponent(m.path)}">${escapeHtml(title)}</div>
                    <div class="small text-muted">
                      Listeners: <strong id="listeners-${encodeURIComponent(m.path)}">${m.listeners || 0}</strong>
                      ${m.content_type ? ` &bull; <code>${escapeHtml(m.content_type)}</code>` : ""}
                    </div>
                  </div>
                  <div class="col-md-6 d-flex flex-column flex-sm-row justify-content-md-end align-items-center gap-2">
                    <audio controls class="w-100" style="max-width: 320px;" src="${escapeHtml(m.path)}" preload="none"></audio>
                    <div class="btn-group">
                      <a href="${escapeHtml(m3uUrl)}" class="btn btn-outline-secondary btn-sm" download>M3U</a>
                      <a href="${escapeHtml(m.path)}" class="btn btn-outline-secondary btn-sm" target="_blank">Direct</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

        totalListenersEl.textContent = totalListeners;

        items.forEach((m) => setupSSE(m.path));
      }

      function setupSSE(mount) {
        if (eventSources[mount]) return;
        const sseUrl = `/_kite/v1/events?mount=${encodeURIComponent(mount)}`;
        const es = new EventSource(sseUrl);
        eventSources[mount] = es;

        es.addEventListener("metadata", (e) => {
          try {
            const data = JSON.parse(e.data);
            const titleEl = document.getElementById(`title-${encodeURIComponent(mount)}`);
            if (titleEl && data.payload?.title) {
              titleEl.textContent = data.payload.title;
            }
          } catch (_) {}
        });

        es.addEventListener("source", (e) => {
          try {
            const data = JSON.parse(e.data);
            const badgeEl = document.getElementById(`badge-${encodeURIComponent(mount)}`);
            if (badgeEl) {
              if (data.payload?.connected) {
                badgeEl.className = "badge bg-success me-1";
                badgeEl.textContent = "Live";
              } else {
                badgeEl.className = "badge bg-secondary me-1";
                badgeEl.textContent = "Offline";
              }
            }
          } catch (_) {}
        });

        es.onerror = () => {
          es.close();
          delete eventSources[mount];
          setTimeout(() => setupSSE(mount), 5000);
        };
      }

      async function fetchStatus() {
        try {
          const res = await fetch("/status-json.xsl");
          if (!res.ok) throw new Error("Status failed");
          const data = await res.json();
          let sources = data?.icestats?.source;
          if (!sources) sources = [];
          if (!Array.isArray(sources)) sources = [sources];
          renderMounts(sources);
        } catch (err) {
          console.error("Error fetching stats:", err);
        }
      }

      fetchStatus();
      setInterval(fetchStatus, 15000);
    })();
  </script>
</body>
</html>
