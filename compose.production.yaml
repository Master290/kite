services:
  kite:
    build: .
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
      - "127.0.0.1:9090:9090/tcp"
    env_file:
      - .env
    volumes:
      - ./kite.production.yaml:/etc/kite/kite.yaml:ro
      - kite-data:/var/lib/kite
    command: ["serve", "-config", "/etc/kite/kite.yaml"]
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  kite-data:
