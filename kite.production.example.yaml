version: 1

server:
  https_address: ":8443"
  http3_address: ":8443"
  public_https_port: 443
  read_header_timeout: 10s
  idle_timeout: 30s
  shutdown_timeout: 15s
  max_header_bytes: 32768

admin:
  address: ":9090"
  token_env: KITE_ADMIN_TOKEN

tls:
  mode: acme
  hosts:
    - radio.example.com
  email: admin@example.com
  cache_directory: /var/lib/kite/acme-cache
  http_challenge_address: ":8080"

defaults:
  source_timeout: 3s
  failback_delay: 5s
  buffer_duration: 2s
  write_interval: 100ms
  icy_meta_interval: 16000
  max_source_bitrate: 512000

mounts:
  - path: /radio
    profile: mp3
    source:
      username: source
      password_env: KITE_SOURCE_PASSWORD
    metadata:
      name: Kite Radio
      genre: Live
      public: true
    cors_origins:
      - "*"
