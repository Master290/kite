<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kite Radio</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui;color:#f7f7fb;background:#10131a}body{min-height:100vh;margin:0;display:grid;place-items:center}.card{width:min(32rem,calc(100% - 3rem));padding:2rem;border:1px solid #303747;border-radius:1.25rem;background:#181d27;box-shadow:0 1.5rem 5rem #0008}.mark{color:#7be0c3;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{min-height:2.6em;margin:1.5rem 0 .75rem;font-size:clamp(1.6rem,6vw,2.6rem)}.status{color:#9da8bc}.controls{display:flex;gap:.75rem;margin-top:2rem}button{border:0;border-radius:999px;padding:.85rem 1.2rem;font:inherit;font-weight:700;cursor:pointer}#play{background:#7be0c3;color:#10221d}#stop{background:#303747;color:#fff}input{width:100%;box-sizing:border-box;margin-top:.5rem;padding:.75rem;border:1px solid #3c4557;border-radius:.6rem;background:#10131a;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Kite</div>
    <h1 class="title" id="title">Ready to fly</h1>
    <p class="status" id="status">Enter a Kite server and mount.</p>
    <label>Server <input id="server" value="https://localhost:8443"></label>
    <label>Mount <input id="mount" value="/radio"></label>
    <div class="controls"><button id="play">Play</button><button id="stop">Stop</button></div>
    <audio id="audio"></audio>
  </main>
  <script type="module">
    import { KitePlayer } from "../sdk/dist/index.js";
    const audio=document.querySelector("#audio"),title=document.querySelector("#title"),status=document.querySelector("#status");let player;
    document.querySelector("#play").onclick=async()=>{player?.stop();player=new KitePlayer({baseURL:document.querySelector("#server").value,mount:document.querySelector("#mount").value,audio});player.addEventListener("metadata",e=>title.textContent=e.detail.payload?.title||"Live");player.addEventListener("source",e=>status.textContent=`Source: ${e.detail.payload?.active??(e.detail.payload?.connected?"connected":"offline")}`);try{await player.play();status.textContent="Playing"}catch(e){status.textContent=e.message}};
    document.querySelector("#stop").onclick=()=>{player?.stop();status.textContent="Stopped"};
  </script>
</body>
</html>
